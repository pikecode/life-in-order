services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: life_in_order
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置本地数据库密码}
      POSTGRES_DB: life_in_order_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_in_order -d life_in_order_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
