server {
    listen 80;
    listen [::]:80;
    server_name ompeak.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/life-in-order-acme; }
    location / { return 301 https://ompeak.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ompeak.com;
    ssl_certificate /etc/letsencrypt/live/ompeak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ompeak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location = /admin { return 302 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
